app-id: ch.imatt.ClipQR
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.golang

command: clipqr

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=all

build-options:
  append-path: /usr/lib/sdk/golang/bin
  env:
    - GOBIN=/app/bin

modules:
  - name: wl-clipboard
    buildsystem: meson
    config-opts:
      - -Dfishcompletiondir=no
    sources:
      - type: archive
        url: https://github.com/bugaevc/wl-clipboard/archive/refs/tags/v2.3.0.tar.gz
        sha256: b4dc560973f0cd74e02f817ffa2fd44ba645a4f1ea94b7b9614dacc9f895f402

  - name: clipqr
    buildsystem: simple
    build-commands:
      - go build -tags wayland -o clipqr
      - install -Dm00755 clipqr ${FLATPAK_DEST}/bin/clipqr
      - install -Dm00644 icon.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
      - install -Dm00644 ${FLATPAK_ID}.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - install -Dm00644 ${FLATPAK_ID}.appdata.xml ${FLATPAK_DEST}/share/appdata/${FLATPAK_ID}.appdata.xml
    sources:
      - type: archive
        url: https://gitlab.com/imatt-foss/clipqr/-/archive/master/clipqr-master.tar.gz
        sha256: 0ecc8e6d0727620d1b395f981bf5c8ab1606301be73df7b54e207e3f44206c69
